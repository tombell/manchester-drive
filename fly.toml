app = "tombell-manchester-drive"
primary_region = "lhr"
# Fly stops the old machine with this signal once the new one passes its check.
kill_signal = "SIGTERM"
kill_timeout = "10s"

[deploy]
  strategy = "bluegreen"

[env]
  HOST = "0.0.0.0"
  PORT = "4173"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
